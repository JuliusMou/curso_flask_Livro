{% extends 'base.html' %}
{% import 'bootstrap/wtf.html' as wtf %}

{% block page_content %}
<div class="row">
    <div class="col-md-8 col-md-offset-2">
        <div class="panel panel-default">
            <div class="panel-heading">
                <h3 class="panel-title">Editar Receita: {{ receita.descricao }}</h3>
            </div>
            <div class="panel-body">
                {{ wtf.quick_form(form, action=url_for('receitas.editar', id=receita.id), method='post') }}
                <a href="{{ url_for('receitas.listar') }}" class="btn btn-default">Voltar</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
