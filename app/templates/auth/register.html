{% extends 'base.html' %}
{% import 'bootstrap/wtf.html' as wtf %}

{% block page_content %}
<div class="row">
    <div class="col-md-4 col-md-offset-4">
        <div class="panel panel-default">
            <div class="panel-heading">
                <h3 class="panel-title">Registrar</h3>
            </div>
            <div class="panel-body">
                {{ wtf.quick_form(form, action=url_for('auth.register'), method='post') }}
                <p class="text-center">
                    <a href="{{ url_for('auth.login') }}">Já tem conta? Faça login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
